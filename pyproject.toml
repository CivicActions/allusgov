[project]
name = "allusgov"
version = "0.4.0"
description = "This project attempts to map the organization of the US Federal Government by gathering and consolidating information from various directories."
authors = [
    { name = "Owen Barton", email = "owen.barton@civicactions.com" },
    { name = "Tom Camp", email = "tom.camp@civicactions.com" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
packages = [{ include = "allusgov" }]
keywords = []
classifiers = [
  "Development Status :: 1 - Planning",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4==4.15.0",
    "bigtree[image]==1.5.3",
    "click==8.4.2",
    "click-log",
    "fastexcel>=0.20.2",
    "flatten-json",
    "loguru>=0.7.3",
    "lxml==6.1.1",
    "natsort",
    "networkx[default]==3.6.1",
    "nltk==3.10.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pandas-stubs~=3.0.5",
    "polars==1.43.2",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml>=6.0.3",
    "questionary==2.1.1",
    "rapidfuzz==3.14.5",
    "scrapy==2.17.0",
    "spacy==3.8.15",
    "w3lib==2.4.1",
    "xlsx2csv==0.8.6",
]


[project.urls]
homepage = "https://pypi.org/project/allusgov"
repository = "https://github.com/civicactions/allusgov"
# documentation = "https://docs.allgov.us/"
changelog = "https://github.com/CivicActions/allusgov/blob/main/CHANGELOG.md"

[project.scripts]
allusgov = "allusgov.cli:main"

[dependency-groups]
dev = [
    "black",
    "coveragespace",
    "freezegun",
    "ipython",
    "isort",
    "mypy",
    "pydocstyle",
    "pyinstaller",
    "pylint",
    "pync ; sys_platform == 'darwin'",
    "pytest",
    "pytest-cov",
    "pytest-describe",
    "pytest-expecter",
    "pytest-random",
    "sniffer",
    "tabula-py",
    "tomli",
    "wrapt",
]


[tool.black]
quiet = true

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
cache_dir = ".cache/mypy/"

[tool.pytest.ini_options]
addopts = """
--strict-markers
-r sxX
--show-capture=log
--cov-report=html
--cov-report=term-missing:skip-covered
--no-cov-on-fail
"""
cache_dir = ".cache/pytest/"
markers = []

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
